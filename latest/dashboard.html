<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TW Sector Simulator - daily-AI-半導體</title>
  <style>
    body { margin: 0; font-family: Segoe UI, Noto Sans TC, Arial, sans-serif; color: #1f2937; background: #f7f8fb; }
    header { padding: 24px 32px; background: #ffffff; border-bottom: 1px solid #d9dee8; }
    main { padding: 24px 32px 48px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    h2 { margin: 28px 0 12px; font-size: 18px; }
    .muted { color: #667085; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid #d9dee8; border-radius: 8px; padding: 16px; }
    .metric { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .notice { margin-top: 10px; padding: 10px 12px; border: 1px solid #f6c177; background: #fff7e6; border-radius: 8px; color: #7a4b00; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d9dee8; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #edf0f5; text-align: left; font-size: 13px; }
    th { background: #f0f3f8; }
    svg { width: 100%; height: 280px; background: #fff; border: 1px solid #d9dee8; border-radius: 8px; }
    .warn { color: #b42318; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>TW Sector Screener 投資模擬器</h1>
    <div class="muted">run: <span id="run-id"></span> ｜ themes: <span id="themes"></span> ｜ period: <span id="period"></span></div>
    <div id="market-status"></div>
  </header>
  <main>
    <section>
      <h2>三人格總覽</h2>
      <div id="summary" class="grid"></div>
    </section>
    <section>
      <h2>Equity Curve</h2>
      <svg id="equity-chart" viewBox="0 0 900 280" role="img" aria-label="equity curve"></svg>
    </section>
    <section>
      <h2>持倉明細</h2>
      <div id="positions"></div>
    </section>
    <section>
      <h2>近期委託與 Skill 遵循度</h2>
      <div id="orders"></div>
    </section>
    <section>
      <h2>最新 Top 20 Analysis Snapshot</h2>
      <div id="analysis"></div>
    </section>
  </main>
  <script>
    const DATA = {"run_id": "daily-AI-半導體", "themes": ["AI", "半導體"], "mode": "daily", "start_date": "2026-05-06", "end_date": "2026-05-06", "initial_cash": 1000000.0, "portfolio_summaries": [{"portfolio_id": "aggressive", "name": "激進型", "equity": 1000000.0, "cash": 1000000.0, "holdings_value": 0.0, "return_pct": 0.0, "max_drawdown_pct": 0.0, "trade_count": 0, "win_rate": 0.0, "turnover_count": 0, "portfolio_diagnostics": {"status": "insufficient_data", "period_count": 0, "var95_pct": 0.0, "cvar95_pct": 0.0, "ulcer_index": 0.0, "omega_ratio": 0.0, "tail_ratio": 0.0, "rolling_sharpe": [], "rolling_volatility": [], "rolling_drawdown": [], "alpha_pct": 0.0, "beta": 0.0, "information_ratio": 0.0, "tracking_error_pct": 0.0, "benchmark_status": "not_provided"}}, {"portfolio_id": "balanced", "name": "穩健型", "equity": 1000000.0, "cash": 1000000.0, "holdings_value": 0.0, "return_pct": 0.0, "max_drawdown_pct": 0.0, "trade_count": 0, "win_rate": 0.0, "turnover_count": 0, "portfolio_diagnostics": {"status": "insufficient_data", "period_count": 0, "var95_pct": 0.0, "cvar95_pct": 0.0, "ulcer_index": 0.0, "omega_ratio": 0.0, "tail_ratio": 0.0, "rolling_sharpe": [], "rolling_volatility": [], "rolling_drawdown": [], "alpha_pct": 0.0, "beta": 0.0, "information_ratio": 0.0, "tracking_error_pct": 0.0, "benchmark_status": "not_provided"}}, {"portfolio_id": "conservative", "name": "保守型", "equity": 1000000.0, "cash": 1000000.0, "holdings_value": 0.0, "return_pct": 0.0, "max_drawdown_pct": 0.0, "trade_count": 0, "win_rate": 0.0, "turnover_count": 0, "portfolio_diagnostics": {"status": "insufficient_data", "period_count": 0, "var95_pct": 0.0, "cvar95_pct": 0.0, "ulcer_index": 0.0, "omega_ratio": 0.0, "tail_ratio": 0.0, "rolling_sharpe": [], "rolling_volatility": [], "rolling_drawdown": [], "alpha_pct": 0.0, "beta": 0.0, "information_ratio": 0.0, "tracking_error_pct": 0.0, "benchmark_status": "not_provided"}}], "daily_equity": [{"trade_date": "2026-05-06", "portfolio_id": "aggressive", "equity": 1000000.0, "cash": 1000000.0, "unsettled_cash": 0.0, "holdings_value": 0.0, "return_pct": 0.0, "drawdown_pct": 0.0, "market_status": "2026-05-06 不是交易日，沿用 2026-05-05 收盤後狀態"}, {"trade_date": "2026-05-06", "portfolio_id": "balanced", "equity": 1000000.0, "cash": 1000000.0, "unsettled_cash": 0.0, "holdings_value": 0.0, "return_pct": 0.0, "drawdown_pct": 0.0, "market_status": "2026-05-06 不是交易日，沿用 2026-05-05 收盤後狀態"}, {"trade_date": "2026-05-06", "portfolio_id": "conservative", "equity": 1000000.0, "cash": 1000000.0, "unsettled_cash": 0.0, "holdings_value": 0.0, "return_pct": 0.0, "drawdown_pct": 0.0, "market_status": "2026-05-06 不是交易日，沿用 2026-05-05 收盤後狀態"}], "positions": [], "orders": [], "trade_count": 0, "policy_violation_count": 0, "latest_analysis": [], "market_status": {"is_trading_day": false, "as_of": "2026-05-06", "source": "TWSE FMTQIK", "note": "2026-05-06 不是交易日，沿用 2026-05-05 收盤後狀態", "warnings": [], "last_trading_date": "2026-05-05"}};
    const fmt = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 });
    document.getElementById('run-id').textContent = DATA.run_id;
    document.getElementById('themes').textContent = (DATA.themes || []).join(', ');
    document.getElementById('period').textContent = `${DATA.start_date || ''} ~ ${DATA.end_date || ''}`;
    const marketStatus = DATA.market_status || {};
    if (marketStatus.note) {
      const div = document.getElementById('market-status');
      div.className = marketStatus.is_trading_day === false ? 'notice' : 'muted';
      div.textContent = marketStatus.note;
    }
    const summary = document.getElementById('summary');
    for (const item of DATA.portfolio_summaries || []) {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `<div>${item.name}</div><div class="metric">${fmt.format(item.equity)} 元</div>
        <div class="muted">報酬 ${item.return_pct.toFixed(2)}% ｜ 回撤 ${item.max_drawdown_pct.toFixed(2)}%</div>
        <div class="muted">現金 ${fmt.format(item.cash)} ｜ 持股 ${fmt.format(item.holdings_value)}</div>
        <div class="muted">VaR95 ${((item.portfolio_diagnostics || {}).var95_pct || 0).toFixed(2)}% ｜ CVaR95 ${((item.portfolio_diagnostics || {}).cvar95_pct || 0).toFixed(2)}% ｜ Omega ${((item.portfolio_diagnostics || {}).omega_ratio || 0).toFixed(2)}</div>`;
      summary.appendChild(div);
    }
    function drawEquity() {
      const svg = document.getElementById('equity-chart');
      const rows = DATA.daily_equity || [];
      const ids = [...new Set(rows.map(r => r.portfolio_id))];
      const values = rows.map(r => r.equity);
      const min = Math.min(...values, DATA.initial_cash || 0);
      const max = Math.max(...values, DATA.initial_cash || 1);
      const colors = ['#c2410c', '#2563eb', '#047857'];
      ids.forEach((id, idx) => {
        const series = rows.filter(r => r.portfolio_id === id);
        const points = series.map((r, i) => {
          const x = 40 + (i * 820 / Math.max(series.length - 1, 1));
          const y = 240 - ((r.equity - min) * 200 / Math.max(max - min, 1));
          return `${x},${y}`;
        }).join(' ');
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        poly.setAttribute('points', points);
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke', colors[idx % colors.length]);
        poly.setAttribute('stroke-width', '3');
        svg.appendChild(poly);
      });
    }
    function table(el, rows, cols) {
      if (!rows.length) { el.textContent = '無資料'; return; }
      const html = `<table><thead><tr>${cols.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>` +
        rows.map(r => `<tr>${cols.map(c => `<td>${r[c[0]] ?? ''}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
      el.innerHTML = html;
    }
    drawEquity();
    table(document.getElementById('positions'), DATA.positions || [], [['portfolio_id','Portfolio'], ['symbol','代碼'], ['name','名稱'], ['quantity','股數'], ['avg_cost','成本'], ['last_price','現價'], ['unrealized_pct','未實現%'], ['recommendation','建議'], ['risk_score','Risk']]);
    table(document.getElementById('orders'), (DATA.orders || []).slice(-80), [['date','日期'], ['portfolio_id','Portfolio'], ['symbol','代碼'], ['side','方向'], ['status','狀態'], ['reason','理由'], ['policy_violation','違規']]);
    table(document.getElementById('analysis'), DATA.latest_analysis || [], [['rank','Rank'], ['symbol','代碼'], ['name','名稱'], ['idea_score','Idea'], ['risk_adjusted_score','RiskAdj'], ['buying_tier','Buying Tier'], ['sharpe_ratio','Sharpe'], ['max_drawdown_pct','MaxDD'], ['recommendation','建議'], ['risk_score','Risk'], ['source_themes','來源題材']]);
  </script>
</body>
</html>
